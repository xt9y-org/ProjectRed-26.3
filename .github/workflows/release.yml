name: ProjectRed manual build + release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Optional release title prefix
        required: false
        default: ProjectRed 26.3 test build
        type: string

permissions:
  contents: write

concurrency:
  group: projectred-26.3-manual-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Fabric mod and publish prerelease
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
          cache-read-only: false

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Validate redstone-only scope
        run: python3 scripts/validate_redstone_scope.py

      - name: Build mod
        run: gradle clean build --stacktrace --no-daemon

      - name: Locate distributable mod JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail

          MOD_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-javadoc.jar' \
            | sort | head -n 1)"

          if [ -z "$MOD_JAR" ]; then
            echo "No distributable mod JAR was produced."
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo "Using mod JAR: $MOD_JAR"
          echo "path=$MOD_JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$MOD_JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectred-26.3-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PREFIX: ${{ inputs.release_name }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="projectred-26.3-test-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          TARGET_SHA="$(git rev-parse HEAD)"
          MOD_JAR="${{ steps.jar.outputs.path }}"
          TITLE="${RELEASE_PREFIX:-ProjectRed 26.3 test build} #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          {
            echo "Automated ProjectRed 26.3 test build from the main branch."
            echo
            echo "Commit: $TARGET_SHA"
            echo "Minecraft: 26.3"
            echo "Fabric Loader: 0.19.5"
            echo "Fabric API: 0.161.0+26.3"
            echo "Java: 25"
            echo
            echo "Scope: ProjectRed circuitry + Transmission + Integration + Fabric multipart layer."
            echo
            echo "Download $(basename "$MOD_JAR") below and place it in your Fabric instance's mods/ folder together with Fabric API."
          } > release-notes.md

          gh release create "$TAG" "$MOD_JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --prerelease
