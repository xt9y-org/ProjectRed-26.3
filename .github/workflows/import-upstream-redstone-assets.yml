name: Import upstream redstone assets

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: import-projectred-assets
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch ProjectRed 1.21.1 assets
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch 1.21.1 \
            https://github.com/MrTJP/ProjectRed.git /tmp/projectred-upstream

          TARGET="src/main/resources/assets/projectred/textures"
          mkdir -p "$TARGET/transmission" "$TARGET/integration/surface" \
                   "$TARGET/integration/block" "$TARGET/item"

          find /tmp/projectred-upstream/transmission/src/main/resources/assets/projectred_transmission/textures/block \
            -maxdepth 1 -type f -name '*.png' ! -name 'low_load_power_wire.png' \
            -exec cp {} "$TARGET/transmission/" \;

          cp /tmp/projectred-upstream/integration/src/main/resources/assets/projectred_integration/textures/block/surface/*.png \
             "$TARGET/integration/surface/"

          for name in \
            base and_cell bus_converter bus_input_panel bus_randomizer bus_xcvr \
            lever logic_cell minus_chip_off minus_chip_on null_cell plus_chip_off plus_chip_on \
            pointer rain_sensor red_chip_off red_chip_on redstone_torch redstone_torch_off \
            segment_display segment_display_digit solar_block_mode solar_dual_mode solar_sky_mode \
            transparent_latch_cell wire_material_border wire_material_off wire_material_on \
            yellow_chip_off yellow_chip_on
          do
            cp "/tmp/projectred-upstream/integration/src/main/resources/assets/projectred_integration/textures/block/$name.png" \
               "$TARGET/integration/block/$name.png"
          done

          cp /tmp/projectred-upstream/core/src/main/resources/assets/projectred_core/textures/item/screwdriver.png \
             "$TARGET/item/screwdriver.png"

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/projectred/textures

          if git diff --cached --quiet; then
            echo "Assets already match upstream."
            exit 0
          fi

          git commit -m "port upstream projectred redstone textures"
          git push origin HEAD:main
